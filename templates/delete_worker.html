<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Worker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .delete-card {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .delete-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
        }

        h1 {
            color: #1e3a5f;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .worker-name {
            color: #2563eb;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        .warning-text {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .button-group button,
        .button-group a {
            flex: 1;
            padding: 13px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .delete-btn {
            background: #dc2626;
            color: #ffffff;
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }

        /* Tablet */
        @media (max-width: 768px) {
            .delete-card {
                max-width: 420px;
                padding: 30px;
            }

            h1 {
                font-size: 25px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .delete-card {
                padding: 25px 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .delete-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group button,
            .button-group a {
                width: 100%;
                padding: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="delete-card">

        

        <h1>Delete Worker</h1>

        <form method="POST">
            {% csrf_token %}

            <p class="worker-name">{{ worker.username }}</p>

            <p class="warning-text">
                Are you sure you want to delete this worker?
                This action cannot be undone.
            </p>

            <div class="button-group">
                <button type="submit" class="delete-btn">
                    Delete Worker
                </button>

                <a href="{% url 'authenti:superwiser-dashboard' %}"
                   class="cancel-btn">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</body>
</html>
